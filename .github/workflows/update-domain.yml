name: Check and Update Domain

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات
    - cron: '0 */6 * * *'
  workflow_dispatch: # يسمح بتشغيله يدوياً من قائمة Actions

jobs:
  check-domain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run domain check script
        run: node check_domain.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sadeemtv.json
          git diff --staged --quiet || (git commit -m "chore: auto-update OrgWeb domain" && git push)
